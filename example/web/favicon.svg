<!--
  Le bot au repos, pas un dessin approchant : le corps est le cercle parfait de
  rayon 100 et les deux matrices d'yeux sont celles produites par
  `engine.sample(1)` sur l'etat `idle` (repere tangent de la sphere compris).
  D'ou l'oeil de droite plus etroit que celui de gauche (0,64 contre 0,87) :
  c'est la compression de profondeur, pas une faute de frappe.

  Les yeux sont des trous, comme dans l'application : le fond de l'onglet passe
  au travers. Le corps s'inverse en theme sombre, sinon un disque noir disparait
  sur une barre d'onglets noire.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-108 -108 216 216">
  <style>
    .corps {
      fill: #0a0a0c;
    }

    @media (prefers-color-scheme: dark) {
      .corps {
        fill: #f9f9f9;
      }
    }
  </style>

  <mask id="yeux">
    <circle r="100" fill="#fff" />
    <path
      d="M-9.3 -11.3A9.3 9.3 0 0 1 0 -20.6L0 -20.6A9.3 9.3 0 0 1 9.3 -11.3L9.3 11.3A9.3 9.3 0 0 1 0 20.6L0 20.6A9.3 9.3 0 0 1 -9.3 11.3Z"
      transform="matrix(0.87,-0.33,0.45,0.84,21.42,-43.32)"
    />
    <path
      d="M-9.3 -11.3A9.3 9.3 0 0 1 0 -20.6L0 -20.6A9.3 9.3 0 0 1 9.3 -11.3L9.3 11.3A9.3 9.3 0 0 1 0 20.6L0 20.6A9.3 9.3 0 0 1 -9.3 11.3Z"
      transform="matrix(0.64,-0.06,0.45,0.84,62.98,-53.9)"
    />
  </mask>

  <circle r="100" class="corps" mask="url(#yeux)" />
</svg>
